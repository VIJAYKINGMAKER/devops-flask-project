name: CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint Python code
        run: python -m ruff check app.py test_app.py

      - name: Run automated tests
        run: python -m pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f dockerfile -t devops-flask-project:latest .

  security-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Build image for security scanning
        run: docker build -f dockerfile -t devops-flask-project:scan .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-flask-project:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  publish-image:
    if: vars.ENABLE_ECR_PUBLISH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, docker-build, security-scan]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/devops-flask-project-dev:main
            ${{ steps.login-ecr.outputs.registry }}/devops-flask-project-dev:${{ github.sha }}

      - name: Deploy to EC2 through SSM
        shell: bash
        env:
          AWS_REGION: us-east-1
          EC2_INSTANCE_ID: i-0f83aaf2ea35da071
          ECR_REGISTRY: 071604987391.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: 071604987391.dkr.ecr.us-east-1.amazonaws.com/devops-flask-project-dev
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMANDS=$(python -c 'import json,os; r=os.environ["AWS_REGION"]; g=os.environ["ECR_REGISTRY"]; i=os.environ["ECR_REPOSITORY"]+":"+os.environ["IMAGE_TAG"]; print(json.dumps({"commands":["set -e","aws ecr get-login-password --region "+r+" | sudo docker login --username AWS --password-stdin "+g,"sudo docker pull "+i,"sudo docker rm -f devops-flask-project || true","sudo docker run -d --name devops-flask-project --restart unless-stopped -p 5000:5000 "+i,"for n in $(seq 1 30); do if curl --fail --silent http://127.0.0.1:5000/health; then exit 0; fi; sleep 2; done","sudo docker logs --tail 50 devops-flask-project","exit 1"]}))')

          echo "Submitting deployment to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$COMMANDS" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM deployment command: $COMMAND_ID"

          for attempt in {1..36}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'StandardOutputContent' \
                --output text
              echo "Deployment and health check succeeded."
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --region "$AWS_REGION" \
                --output json
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out waiting for SSM."
          exit 1